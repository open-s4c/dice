name: Performance regression tests
on:
  pull_request:

env:
  REGISTRY: ghcr.io

jobs:
  configured-runtime:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cfg:
          - {cc: gcc, cxx: g++, lto: full}
          - {cc: clang, cxx: clang++, lto: full}
          - {cc: clang, cxx: clang++, lto: thin}
    steps:
      - uses: actions/checkout@v6
      - name: Configure generated-runtime benchmarks
        run: cmake -Bbuild
             -DCMAKE_C_COMPILER=${{ matrix.cfg.cc }}
             -DCMAKE_CXX_COMPILER=${{ matrix.cfg.cxx }}
             -DCMAKE_BUILD_TYPE=Release
             -DDICE_TESTS=OFF -DDICE_BENCHMARKS=ON -DDICE_LTO=OFF
             -DDICE_ROLL_BENCH_LTO=${{ matrix.cfg.lto }}
      - name: Build generated-runtime benchmarks
        run: cmake --build build --target roll-benchmarks -j 2
      - name: Measure generated dispatch and inspect call paths
        run: cmake -DBUILD=build -P scripts/benchmark-roll.cmake
      - uses: actions/upload-artifact@v4
        with:
          name: configured-${{ matrix.cfg.cc }}-${{ matrix.cfg.lto }}
          path: build/bench/roll/results

  test-linux-x86:
    if: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04, ubuntu-24.04-arm, ubuntu-22.04-arm]
        cc: [ "gcc", "clang" ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Get compiler version
        run: ${{ matrix.cc }} --version
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Ensure main was fetched
        run: git fetch --depth 1 origin main:main
      - name: Configure benchmark with HEAD
        run: cmake -Bbuild
             -DCMAKE_C_COMPILER=${{ matrix.cc }}
             -DCMAKE_BUILD_TYPE=Release

      - name: Build benchmark with HEAD
        run: cmake --build build -t micro3 -t micro4

      - name: Run micro3 regression test
        run: scripts/regression.sh
             -c ${{ matrix.cc }}
             -b micro3
             -t HEAD -t main
             run sum
      - name: Show micro3 results
        run: cat results.csv
      - name: Ensure HEAD is not slower than main on micro3
        run: scripts/regression.sh check HEAD

      - name: Run micro4 regression test
        run: scripts/regression.sh
             -c ${{ matrix.cc }}
             -b micro4
             -t HEAD -t main
             run sum
      - name: Show micro4 results
        run: cat results.csv
      - name: Ensure HEAD is not slower than main on micro4
        run: scripts/regression.sh check HEAD

      - run: cd work-HEAD-${{ matrix.cc }} && git rev-parse --short HEAD
      - run: cd work-main-${{ matrix.cc }} && git rev-parse --short HEAD
